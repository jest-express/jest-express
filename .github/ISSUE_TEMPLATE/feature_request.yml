name: Feature request
description: Suggest an idea for jest-express
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the testing situation that jest-express currently handles poorly or not at all.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should jest-express do? If it involves a mock API, sketch the call you would make in a test.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you have tried or considered, including existing jest-express features that did not fit.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else, such as Express behavior the feature should match or related issues.
    validations:
      required: false

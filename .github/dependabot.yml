# Dependabot version updates: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # One config covers the pnpm workspace: the root, every package and every example.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/packages/*"
      - "/examples/*"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      turborepo:
        patterns:
          - turbo
          - "@turbo/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"

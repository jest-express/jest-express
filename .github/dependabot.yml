# Dependabot version updates: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # pnpm workspace: run once from the root, where pnpm-workspace.yaml and the single
  # pnpm-lock.yaml live. Dependabot updates the packages' and examples' manifests from
  # there; listing them as separate directories made it write lockfiles that drop the
  # other workspace importers.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # @types/node tracks the lowest supported Node (engines: >=22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the native port) needs its own migration: tsdown's declaration
      # build and Vitest's typecheck depend on the TypeScript API.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      turborepo:
        patterns:
          - turbo
          - "@turbo/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
